{% extends 'base.html' %} {% load static %} {% block styles %}
<link rel="stylesheet" href="{% static 'css/styles.css' %}" />
{% endblock %} {% block content %}

<div class="profile-page">
  <div class="profile-card-modern edit-card">
    <!-- HEADER -->
    <div class="profile-top">
      <div class="profile-avatar-modern">
        <img
          src="{{ user.profile.avatar.url|default:'/static/images/default-avatar.png' }}"
          alt="Avatar"
        />
      </div>

      <h2>Edit Profile</h2>

      <p class="profile-role">Update your account information</p>
    </div>

    <!-- FORM -->
    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="profile-grid">
        {% for field in form %}

        <div
          class="form-group {% if field.name == 'bio' %}full-card{% endif %}"
        >
          <label for="{{ field.id_for_label }}"> {{ field.label }} </label>

          {% if field.name == 'avatar' %}

          <div class="avatar-upload-wrapper">
            <label class="custom-upload-btn">
              <i class="fa-solid fa-image"></i>
              Change Avatar

              <input
                type="file"
                name="{{ field.name }}"
                id="{{ field.id_for_label }}"
                hidden
              />
            </label>
          </div>

          {% else %} {{ field }} {% endif %}
        </div>

        {% endfor %}
      </div>

      <button type="submit" class="profile-save-btn">
        <i class="fa-solid fa-floppy-disk"></i>
        Save Changes
      </button>
    </form>
  </div>
</div>

{% endblock %}
